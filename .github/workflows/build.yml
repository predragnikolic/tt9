name: Build the Project

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # setup
    - name: Checkout project sources
      uses: actions/checkout@v5
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    # validate and build
    - name: Generate Documents
      run: ./gradlew generateDocs
    - name: Validate Dictionaries
      run: ./gradlew validateLanguages
    - name: Build Languages
      run: ./gradlew buildDefinition buildDictionaryDownloads
    - name: Copy Downloads
      run: ./gradlew copyDownloadsToAssets
    - name: Lint
      run: ./gradlew lint # this actually runs mergeResources, so it must come after the dictionary tasks
    - name: Build 'Lite' and 'Full' APK variants
      run: ./gradlew assembleLiteRelease assembleFullRelease

    - name: List APK outputs (debug)
      run: |
        echo "=== Finding APK files ==="
        find . -path "*/build/outputs/apk/*" -type f -name '*.apk' -print || true
        echo "=== Detailed APK directories ==="
        for d in $(find . -type d -path "*/build/outputs/apk/*" -print); do
          echo "---- $d ----"
          ls -al "$d" || true
        done

    - name: Upload Lite APK
      uses: actions/upload-artifact@v4
      with:
        name: app-lite-release
        path: |
          '**/build/outputs/apk/**/release/*lite*-release*.apk'
